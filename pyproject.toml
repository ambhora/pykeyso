[project]
name = "keyso"
dynamic = ["version"]
description = "A dictionary-based configuration-space library"
readme = "readme.md"
license = "Apache-2.0"
authors = [
  { name = "Jayesh Badwaik", email = "j.badwaik@fz-juelich.de" },
]
dependencies = []

[project.urls]
Source = "https://gitlab.com/ambhora/software/keyso"

# ------------------------------------------------------------------------------
# Dependency groups
# ------------------------------------------------------------------------------
[dependency-groups]
test = [
  "pytest>=6.3",
  "pytest-cov",
]

mypy = [
  "mypy",
  "pytest",
]

docs = [
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-awesome-nav",
  "mkdocs-add-number-plugin",
  "gitpython",
  "pyyaml",
  "pymdown-extensions",
  "mkdocs-gen-files",
  "mkdocs-awesome-pages-plugin",
  "mkdocs-macros-plugin",
  "mkdocs-pagetree-plugin",
  "mkdocs-git-authors-plugin",
  "mkdocs-git-revision-date-localized-plugin",
]

format = [
  "black",
  "docformatter",
]

# ------------------------------------------------------------------------------
# Hatch configuration
# ------------------------------------------------------------------------------
[tool.hatch.version]
path = "src/keyso/metadata.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyso"]

[tool.hatch.build.targets.wheel.shared-data]
"share" = "share"

# ------------------------------------------------------------------------------
# PyTest configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src", "test/lib"]
addopts = "--cov=keyso --cov-report term-missing --cov-fail-under=90 --cov-config=.coveragerc"
testpaths = ["test"]

[tool.black]
line-length = 100

